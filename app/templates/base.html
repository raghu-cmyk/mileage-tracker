<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Mileage Tracker</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7fb; }
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    main { background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 2rem; width: min(420px, 92vw); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input { width: 100%; padding: .6rem .75rem; border: 1px solid #ccd; border-radius: 8px; box-sizing: border-box; }
    button, .button { margin-top: 1rem; width: 100%; padding: .7rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
    .error { background: #fee2e2; color: #991b1b; padding: .75rem; border-radius: 8px; margin-bottom: 1rem; }
    .muted { color: #64748b; font-size: .9rem; margin-top: 1rem; text-align: center; }
    .muted a { color: #2563eb; }
  </style>
</head>
<body>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>

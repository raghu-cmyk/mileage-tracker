<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ title }} — Mileage Tracker</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #1a1a1a; background: #f6f7fb; }
    body { margin: 0; min-height: 100vh; }
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 1rem 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    header nav a { margin-right: 1rem; color: #2563eb; text-decoration: none; font-weight: 600; }
    main { max-width: 720px; margin: 2rem auto; background: #fff; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.08); padding: 2rem; width: min(720px, 92vw); }
    h1 { margin-top: 0; font-size: 1.5rem; }
    label { display: block; margin: .75rem 0 .25rem; font-weight: 600; }
    input, textarea, select { width: 100%; padding: .6rem .75rem; border: 1px solid #ccd; border-radius: 8px; box-sizing: border-box; }
    textarea { min-height: 5rem; resize: vertical; }
    button, .button { margin-top: 1rem; padding: .7rem 1rem; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; display: inline-block; }
    button.secondary, .button.secondary { background: #64748b; }
    button.danger, .button.danger { background: #b91c1c; }
    .error { background: #fee2e2; color: #991b1b; padding: .75rem; border-radius: 8px; margin-bottom: 1rem; }
    .success { background: #dcfce7; color: #166534; padding: .75rem; border-radius: 8px; margin-bottom: 1rem; }
    .muted { color: #64748b; font-size: .9rem; }
    .muted a { color: #2563eb; }
    table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
    th, td { text-align: left; padding: .6rem; border-bottom: 1px solid #e2e8f0; }
    .badge { display: inline-block; padding: .2rem .5rem; border-radius: 999px; font-size: .75rem; font-weight: 600; background: #e2e8f0; }
    .badge.archived { background: #fef3c7; color: #92400e; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: 1rem; }
    .inline-form { display: inline; }
    .inline-form button { margin-top: 0; }
  </style>
</head>
<body>
  {% if user is defined and user %}
  <header>
    <nav>
      <a href="/">Dashboard</a>
      <a href="/vehicles">Vehicles</a>
    </nav>
    <form method="post" action="/logout" class="inline-form">
      <button type="submit" class="secondary">Log out</button>
    </form>
  </header>
  {% endif %}
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
